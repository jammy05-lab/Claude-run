{% extends "base.html" %}
{% block title %}Add Topic – LearnLoop{% endblock %}
{% block content %}

<div class="form-container">
  <h2>What did you learn?</h2>
  <form method="POST" action="/add">
    <div class="field">
      <label for="title">Topic</label>
      <input type="text" id="title" name="title"
             placeholder="e.g. LoRA fine-tuning" required autofocus>
    </div>
    <div class="field">
      <label for="notes">Explain it in your own words</label>
      <textarea id="notes" name="notes" rows="5" required
        placeholder="e.g. LoRA freezes the base model weights and trains small low-rank adapter matrices, making fine-tuning much cheaper..."></textarea>
    </div>
    <div class="field">
      <label for="category">Category <span class="optional">(optional)</span></label>
      <input type="text" id="category" name="category"
             placeholder="e.g. ML, AWS, Python">
    </div>
    <button type="submit" class="btn btn-primary">Save &rarr;</button>
  </form>
</div>

{% endblock %}
